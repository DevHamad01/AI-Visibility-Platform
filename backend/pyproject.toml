[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-visibility-backend"
version = "0.1.0"
description = "AI Visibility Platform — backend API, pipeline and worker"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "flask-openapi3[swagger]==4.3.2",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "SQLAlchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.8",
    "redis==8.1.0",
    "rq==3.0.0",
    "structlog==26.1.0",
    "prometheus-client==0.26.0",
    "sentry-sdk[flask]==2.74.0",
    "gunicorn==26.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: we deliberately use `class X(str, enum.Enum)` (not enum.StrEnum) so
# SQLAlchemy's `values_callable=lambda x: [e.value for e in x]` keeps storing
# the plain string value, not StrEnum's own str() formatting.
ignore = ["UP042"]
