server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Nginx's own liveness, used by the container healthcheck.
    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }

    # Backend readiness (DB + Redis + config), proxied so the shell's status
    # indicator reflects the API rather than this nginx. Without an explicit
    # location it would fall through to the SPA and always answer 200.
    location = /readyz {
        access_log off;
        proxy_pass http://api:8000/readyz;
        proxy_set_header Host $host;
    }
    location ~ ^/api/v1/runs/[^/]+/events$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 660s;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
    }
    location ~* \.(?:js|css|woff2)$ {
        expires 1y;
        add_header Cache-Control 'public, immutable';
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ /index.html;
    }
}
